# Build the mod on a clean Windows runner and package the player zip. Nothing here touches the game: the tree
# builds from the committed export names, room databases and prism SDK parts, and the only tests are the
# engine-free core's. Every push uploads the zip (+ the PDB, kept separately for symbolizing crash logs); a
# tag v* also publishes it as a GitHub release.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (VS 2022 via tools/vsdev.cmd, Ninja RelWithDebInfo)
        shell: cmd
        run: tools\build.cmd
      - name: Core unit tests
        shell: cmd
        run: build\ninja\gdcore_tests.exe
      - name: Package
        shell: cmd
        run: python tools\package.py --out dist\gdaccess.zip --pdb-out dist\pdb
      - uses: actions/upload-artifact@v4
        with:
          name: gdaccess
          path: dist/gdaccess.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gdaccess-pdb
          path: dist/pdb/gdaccess.pdb
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/gdaccess.zip dist/pdb/gdaccess.pdb --title "${GITHUB_REF_NAME}" --generate-notes
