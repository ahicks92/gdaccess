[package]
name = "gdaccess-installer"
version = "0.1.0"
edition = "2021"
description = "GD Access installer: downloads a release of the Grim Dawn screen-reader mod, installs it per-user, makes shortcuts"

[[bin]]
name = "GDAccessInstaller"
path = "src/main.rs"

[dependencies]
wxdragon = "0.9"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
semver = "1"
dirs = "6"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
